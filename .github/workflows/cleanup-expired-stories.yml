name: Cleanup expired SR content

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke SR cleanup function
        run: |
          curl --fail-with-body --request POST "$SR_STORY_CLEANUP_URL" \
            --header "x-sr-cleanup-token: $SR_STORY_CLEANUP_TOKEN"
        env:
          SR_STORY_CLEANUP_URL: ${{ secrets.SR_STORY_CLEANUP_URL }}
          SR_STORY_CLEANUP_TOKEN: ${{ secrets.SR_STORY_CLEANUP_TOKEN }}
